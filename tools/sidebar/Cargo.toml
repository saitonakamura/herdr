[package]
name = "herdr-sidebar"
version = "0.1.0"
edition = "2021"
description = "The fork's sidebar program: herdr's agents as a tree, drawn in the session pane"
license = "Apache-2.0"
repository = "https://github.com/saitonakamura/herdr"
publish = false

[[bin]]
name = "herdr-sidebar"
path = "src/main.rs"

[dependencies]
crossterm = "0.29"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
unicode-width = "0.2"

[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"

[dev-dependencies]
schemars = "1.2.1"
